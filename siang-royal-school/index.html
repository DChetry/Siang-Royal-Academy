<body>
  <!-- React Mount Point -->

    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Poppins', sans-serif; color: #0F2C59; background: #F8FAFC;">
      <div style="text-align: center;">
        <img src="assets/logo/sschool.jpg" alt="Siiang Royal School Logo" style="height: 60px; margin: 0 auto 1.5rem auto;">
        <p style="font-size: 1.1rem; font-weight: 600; color: #1E3A8A;">Loading Siang Royal School Portal...</p>
      </div>
    </div>
  </div>

  <!-- React Application Source -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const data = window.SCHOOL_DATA;

    // --- REUSABLE SVG ICONS ---
    const Icon = ({ name, size = 18, color = "currentColor", className = "" }) => {
      const icons = {
        phone: <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>,
        mail: <><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></>,
        mapPin: <><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></>,
        calendar: <><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>,
        award: <><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></>,
        book: <><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></>,
        users: <><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
        building: <><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="9" y1="22" x2="9" y2="12"/><line x1="15" y1="12" x2="15" y2="22"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="8" y1="6" x2="8.01" y2="6"/><line x1="16" y1="6" x2="16.01" y2="6"/><line x1="12" y1="6" x2="12.01" y2="6"/><line x1="8" y1="9" x2="8.01" y2="9"/><line x1="16" y1="9" x2="16.01" y2="9"/><line x1="12" y1="9" x2="12.01" y2="9"/></>,
        fileText: <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></>,
        checkCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>,
        chevronDown: <polyline points="6 9 12 15 18 9"/>,
        chevronRight: <polyline points="9 18 15 12 9 6"/>,
        chevronLeft: <polyline points="15 18 9 12 15 6"/>,
        search: <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
        externalLink: <><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></>,
        video: <><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></>,
        download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>,
        shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,
        close: <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
        clock: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>
      };

      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke={color}
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          {icons[name] || null}
        </svg>
      );
    };

    // --- ANIMATED NUMBER COUNTER COMPONENT ---
    const Counter = ({ target, decimals = 0, suffix = "" }) => {
      const [count, setCount] = useState(0);

      useEffect(() => {
        let start = 0;
        const duration = 1600;
        const startTime = performance.now();

        const update = (now) => {
          const progress = Math.min((now - startTime) / duration, 1);
          const easeProgress = 1 - Math.pow(1 - progress, 3);
          const current = start + easeProgress * (target - start);
          setCount(current);
          if (progress < 1) {
            requestAnimationFrame(update);
          }
        };

        requestAnimationFrame(update);
      }, [target]);

      return (
        <span>
          {decimals > 0
            ? count.toLocaleString('en-IN', { minimumFractionDigits: decimals, maximumFractionDigits: decimals })
            : Math.floor(count).toLocaleString('en-IN')}
          {suffix}
        </span>
      );
    };

    // --- APPLICATION ROOT COMPONENT ---
    function App() {
      const [page, setPage] = useState('home');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);
      const [enquiryModalOpen, setEnquiryModalOpen] = useState(false);
      const [enquirySubmitted, setEnquirySubmitted] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      // Hash-based routing synchronization
      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash.replace('#', '').trim();
          if (hash && ['home', 'about', 'academics', 'admissions', 'faculty', 'facilities', 'events', 'gallery', 'notices', 'disclosure', 'contact'].includes(hash)) {
            setPage(hash);
          }
        };

        window.addEventListener('hashchange', handleHashChange);
        if (window.location.hash) {
          handleHashChange();
        }

        const handleScroll = () => {
          setScrolled(window.scrollY > 30);
        };
        window.addEventListener('scroll', handleScroll);

        return () => {
          window.removeEventListener('hashchange', handleHashChange);
          window.removeEventListener('scroll', handleScroll);
        };
      }, []);

      const navigate = (pageId) => {
        setPage(pageId);
        window.location.hash = pageId;
        setMobileMenuOpen(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 4000);
      };

      // Modal Enquiry Form State
      const [formData, setFormData] = useState({
        studentName: '',
        parentName: '',
        email: '',
        phone: '',
        grade: 'Class I - V',
        message: ''
      });
      const [formErrors, setFormErrors] = useState({});

      const handleEnquirySubmit = (e) => {
        e.preventDefault();
        const errors = {};
        if (!formData.studentName.trim()) errors.studentName = 'Student name is required';
        if (!formData.parentName.trim()) errors.parentName = 'Parent/Guardian name is required';
        if (!formData.phone.trim() || formData.phone.length < 10) errors.phone = 'Valid 10-digit mobile number required';
        if (!formData.email.trim() || !formData.email.includes('@')) errors.email = 'Valid email is required';

        if (Object.keys(errors).length > 0) {
          setFormErrors(errors);
          return;
        }

        setFormErrors({});
        setEnquirySubmitted(true);
        setTimeout(() => {
          setEnquirySubmitted(false);
          setEnquiryModalOpen(false);
          setFormData({ studentName: '', parentName: '', email: '', phone: '', grade: 'Class I - V', message: '' });
          showToast('Enquiry details recorded (Frontend Demo). We will connect shortly!');
        }, 2000);
      };

      return (
        <div className="site-wrapper">
          {/* Toast Notification */}
          {toastMsg && (
            <div style={{
              position: 'fixed',
              bottom: '24px',
              right: '24px',
              backgroundColor: '#0F2C59',
              color: '#FFFFFF',
              padding: '1rem 1.5rem',
              borderRadius: '8px',
              boxShadow: '0 10px 25px rgba(0,0,0,0.2)',
              borderLeft: '4px solid #D4AF37',
              zIndex: 9999,
              display: 'flex',
              alignItems: 'center',
              gap: '0.75rem',
              fontSize: '0.925rem'
            }}>
              <Icon name="checkCircle" size={20} color="#D4AF37" />
              <span>{toastMsg}</span>
            </div>
          )}

          {/* Top Announcement Bar */}
          <div className="topbar">
            <div className="container">
              <div className="topbar-info">
                <span className="topbar-item">
                  <Icon name="shield" size={14} color="#D4AF37" />
                  <span>CBSE Affiliation No: <strong>{data.general.affiliationNo}</strong></span>
                </span>
                <span className="topbar-item">
                  <span>School Code: <strong>{data.general.schoolCode}</strong></span>
                </span>
                <span className="topbar-item" style={{ color: '#93C5FD' }}>
                  <Icon name="mapPin" size={13} color="#93C5FD" />
                  <span>East Siang, Arunachal Pradesh</span>
                </span>
              </div>
              <div className="topbar-contact">
                <a href={`tel:${data.general.contact.phone}`}>
                  <Icon name="phone" size={13} color="#D4AF37" />
                  <span>{data.general.contact.phone}</span>
                </a>
                <a href={`mailto:${data.general.contact.email}`}>
                  <Icon name="mail" size={13} color="#D4AF37" />
                  <span>{data.general.contact.email}</span>
                </a>
              </div>
            </div>
          </div>

          {/* Sticky Header / Navbar */}
          <header className={`site-header ${scrolled ? 'scrolled' : ''}`}>
            <div className="container">
              <nav className="navbar">
                <a href="#home" onClick={(e) => { e.preventDefault(); navigate('home'); }} className="nav-brand">
                  <img src="assets/logo/logo.svg" alt="Siang Royal School" className="nav-brand-logo" />
                </a>

                {/* Desktop Navigation Links */}
                <ul className="nav-links">
                  {[
                    { id: 'home', label: 'Home' },
                    { id: 'about', label: 'About' },
                    { id: 'academics', label: 'Academics' },
                    { id: 'admissions', label: 'Admissions' },
                    { id: 'facilities', label: 'Campus' },
                    { id: 'faculty', label: 'Faculty' },
                    { id: 'events', label: 'Events' },
                    { id: 'gallery', label: 'Gallery' },
                    { id: 'notices', label: 'Notices' },
                    { id: 'disclosure', label: 'CBSE SARAS' },
                    { id: 'contact', label: 'Contact' }
                  ].map((item) => (
                    <li key={item.id}>
                      <button
                        onClick={() => navigate(item.id)}
                        className={`nav-link ${page === item.id ? 'active' : ''}`}
                      >
                        {item.label}
                      </button>
                    </li>
                  ))}
                </ul>

                {/* Header Actions */}
                <div className="nav-actions">
                  <button
                    onClick={() => setEnquiryModalOpen(true)}
                    className="btn btn-secondary btn-sm btn-desktop"
                  >
                    Apply / Enquire
                  </button>
                  <button
                    className={`mobile-nav-toggle ${mobileMenuOpen ? 'open' : ''}`}
                    onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                    aria-label="Toggle navigation menu"
                  >
                    <span></span>
                    <span></span>
                    <span></span>
                  </button>
                </div>
              </nav>
            </div>
          </header>

          {/* Mobile Navigation Drawer */}
          <div
            className={`mobile-drawer-backdrop ${mobileMenuOpen ? 'open' : ''}`}
            onClick={() => setMobileMenuOpen(false)}
          ></div>
          <aside className={`mobile-drawer ${mobileMenuOpen ? 'open' : ''}`}>
            <div className="mobile-drawer-header">
              <img src="assets/logo/logo.svg" alt="Siang Royal School" style={{ height: '38px' }} />
              <button
                className="mobile-drawer-close"
                onClick={() => setMobileMenuOpen(false)}
                aria-label="Close menu"
              >
                &times;
              </button>
            </div>
            <ul className="mobile-drawer-links">
              {[
                { id: 'home', label: 'Home' },
                { id: 'about', label: 'About Us' },
                { id: 'academics', label: 'Academics' },
                { id: 'admissions', label: 'Admissions' },
                { id: 'facilities', label: 'Campus & Facilities' },
                { id: 'faculty', label: 'Faculty & Staff' },
                { id: 'events', label: 'Events' },
                { id: 'gallery', label: 'Gallery' },
                { id: 'notices', label: 'Notices & Circulars' },
                { id: 'disclosure', label: 'CBSE Mandatory Disclosure' },
                { id: 'contact', label: 'Contact Us' }
              ].map((item) => (
                <li key={item.id}>
                  <button
                    onClick={() => navigate(item.id)}
                    className={`mobile-drawer-link ${page === item.id ? 'active' : ''}`}
                    style={{ width: '100%', textAlign: 'left', border: 'none', background: 'none' }}
                  >
                    <span>{item.label}</span>
                    <Icon name="chevronRight" size={14} color="#94A3B8" />
                  </button>
                </li>
              ))}
            </ul>
            <div style={{ marginTop: 'auto', paddingTop: '1.5rem', borderTop: '1px solid #E2E8F0' }}>
              <button
                onClick={() => { setMobileMenuOpen(false); setEnquiryModalOpen(true); }}
                className="btn btn-primary"
                style={{ width: '100%' }}
              >
                Apply / Enquire
              </button>
              <div style={{ marginTop: '1rem', fontSize: '0.8rem', color: '#64748B', textAlign: 'center' }}>
                Affiliation: <strong>2230091</strong> | Code: <strong>35089</strong>
              </div>
            </div>
          </aside>

          {/* MAIN PAGE VIEW ROUTING */}
          <main className="main-content">
            {page === 'home' && <HomePage navigate={navigate} setEnquiryModalOpen={setEnquiryModalOpen} />}
            {page === 'about' && <AboutPage navigate={navigate} />}
            {page === 'academics' && <AcademicsPage navigate={navigate} />}
            {page === 'admissions' && <AdmissionsPage navigate={navigate} setEnquiryModalOpen={setEnquiryModalOpen} showToast={showToast} />}
            {page === 'faculty' && <FacultyPage />}
            {page === 'facilities' && <FacilitiesPage />}
            {page === 'events' && <EventsPage />}
            {page === 'gallery' && <GalleryPage />}
            {page === 'notices' && <NoticesPage />}
            {page === 'disclosure' && <DisclosurePage />}
            {page === 'contact' && <ContactPage showToast={showToast} />}
          </main>

          {/* Global Apply / Enquiry Modal */}
          {enquiryModalOpen && (
            <div className="modal-backdrop" onClick={(e) => { if (e.target.classList.contains('modal-backdrop')) setEnquiryModalOpen(false); }}>
              <div className="modal-card">
                <button className="modal-close-btn" onClick={() => setEnquiryModalOpen(false)}>&times;</button>
                <div style={{ textAlign: 'left', marginBottom: '1.5rem' }}>
                  <span className="section-badge">Admissions Desk</span>
                  <h3 style={{ color: '#0F2C59', marginTop: '0.25rem' }}>Admission Enquiry 2026–27</h3>
                  <p style={{ color: '#64748B', fontSize: '0.9rem', marginTop: '0.25rem' }}>
                    Siang Royal School, Mirbuk Pekung (CBSE Affiliated 2230091)
                  </p>
                </div>

                {enquirySubmitted ? (
                  <div style={{ textAlign: 'center', padding: '2rem 1rem' }}>
                    <div style={{ width: '60px', height: '60px', borderRadius: '50%', background: '#DCFCE7', color: '#166534', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 1rem' }}>
                      <Icon name="checkCircle" size={32} color="#166534" />
                    </div>
                    <h4 style={{ color: '#0F2C59', marginBottom: '0.5rem' }}>Enquiry Received Successfully!</h4>
                    <p style={{ color: '#64748B', fontSize: '0.9rem' }}>
                      Thank you for contacting Siang Royal School. Our admissions coordinator will reach out to you shortly.
                    </p>
                  </div>
                ) : (
                  <form onSubmit={handleEnquirySubmit}>
                    <div className="form-group">
                      <label className="form-label">Student's Full Name *</label>
                      <input
                        type="text"
                        className={`form-control ${formErrors.studentName ? 'error' : ''}`}
                        placeholder="Enter student's full name"
                        value={formData.studentName}
                        onChange={(e) => setFormData({ ...formData, studentName: e.target.value })}
                      />
                      {formErrors.studentName && <span className="form-error-msg">{formErrors.studentName}</span>}
                    </div>

                    <div className="form-group">
                      <label className="form-label">Parent / Guardian Name *</label>
                      <input
                        type="text"
                        className={`form-control ${formErrors.parentName ? 'error' : ''}`}
                        placeholder="Enter parent / guardian name"
                        value={formData.parentName}
                        onChange={(e) => setFormData({ ...formData, parentName: e.target.value })}
                      />
                      {formErrors.parentName && <span className="form-error-msg">{formErrors.parentName}</span>}
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                      <div className="form-group">
                        <label className="form-label">Contact Phone *</label>
                        <input
                          type="tel"
                          className={`form-control ${formErrors.phone ? 'error' : ''}`}
                          placeholder="10-digit mobile number"
                          value={formData.phone}
                          onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                        />
                        {formErrors.phone && <span className="form-error-msg">{formErrors.phone}</span>}
                      </div>
                      <div className="form-group">
                        <label className="form-label">Email Address *</label>
                        <input
                          type="email"
                          className={`form-control ${formErrors.email ? 'error' : ''}`}
                          placeholder="name@example.com"
                          value={formData.email}
                          onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                        />
                        {formErrors.email && <span className="form-error-msg">{formErrors.email}</span>}
                      </div>
                    </div>

                    <div className="form-group">
                      <label className="form-label">Class Seeking Admission</label>
                      <select
                        className="form-control"
                        value={formData.grade}
                        onChange={(e) => setFormData({ ...formData, grade: e.target.value })}
                      >
                        <option value="Primary (Class I - V)">Primary (Class I - V)</option>
                        <option value="Middle School (Class VI - VIII)">Middle School (Class VI - VIII)</option>
                        <option value="Secondary (Class IX - X)">Secondary (Class IX - X)</option>
                        <option value="Senior Secondary (Class XI - XII)">Senior Secondary (Class XI - XII)</option>
                      </select>
                    </div>

                    <div className="form-group">
                      <label className="form-label">Optional Query or Remarks</label>
                      <textarea
                        className="form-control"
                        rows="3"
                        placeholder="Any specific questions regarding admissions, transport or curriculum..."
                        value={formData.message}
                        onChange={(e) => setFormData({ ...formData, message: e.target.value })}
                      ></textarea>
                    </div>

                    <div style={{ display: 'flex', gap: '1rem', marginTop: '1.5rem' }}>
                      <button type="submit" className="btn btn-primary" style={{ flex: 1 }}>
                        Submit Enquiry
                      </button>
                      <button type="button" onClick={() => setEnquiryModalOpen(false)} className="btn btn-outline" style={{ flex: '0 0 auto' }}>
                        Cancel
                      </button>
                    </div>
                    <p style={{ fontSize: '0.75rem', color: '#94A3B8', marginTop: '0.75rem', textAlign: 'center' }}>
                      Note: This is a frontend demo validation form. Official enquiries can also be sent directly to <strong>siangroyalschool@gmail.com</strong>.
                    </p>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* SITE FOOTER */}
          <footer className="site-footer">
            <div className="footer-top">
              <div className="container">
                <div className="footer-grid">
                  {/* Column 1: School Identity */}
                  <div className="footer-brand">
                    <img src="assets/logo/logo.svg" alt="Siang Royal School" style={{ height: '48px', filter: 'brightness(0) invert(1)' }} />
                    <p>
                      A premier CBSE institution fostering intellectual discipline, community growth, and academic excellence in the serene valley of East Siang, Arunachal Pradesh.
                    </p>
                    <div className="footer-affil-tag">
                      <div>CBSE Affiliation No: <strong>{data.general.affiliationNo}</strong></div>
                      <div>School Code: <strong>{data.general.schoolCode}</strong></div>
                      <div style={{ marginTop: '0.35rem', color: '#93C5FD' }}>Appendix-IX SARAS 7.0 Compliant</div>
                    </div>
                  </div>

                  {/* Column 2: School Links */}
                  <div>
                    <h4 className="footer-heading">School</h4>
                    <ul className="footer-nav-list">
                      <li><a href="#about" onClick={(e) => { e.preventDefault(); navigate('about'); }}>About SRS</a></li>
                      <li><a href="#academics" onClick={(e) => { e.preventDefault(); navigate('academics'); }}>Academic Curriculum</a></li>

    // =========================================================================
    // 8. GALLERY PAGE VIEW
    // =========================================================================
    function GalleryPage() {
      const [filter, setFilter] = useState('All');
      const [lightboxIdx, setLightboxIdx] = useState(null);

      const filteredGallery = filter === 'All'
        ? data.gallery
        : data.gallery.filter(g => g.category === filter);

      // Keyboard navigation for lightbox
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (lightboxIdx === null) return;
          if (e.key === 'Escape') setLightboxIdx(null);
          if (e.key === 'ArrowRight') setLightboxIdx((lightboxIdx + 1) % filteredGallery.length);
          if (e.key === 'ArrowLeft') setLightboxIdx((lightboxIdx - 1 + filteredGallery.length) % filteredGallery.length);
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [lightboxIdx, filteredGallery]);

      return (
        <div>
          <div style={{ background: '#0F2C59', color: '#FFFFFF', padding: '4rem 0 3.5rem', textAlign: 'center' }}>
            <div className="container">
              <span className="section-badge" style={{ background: 'rgba(212, 175, 55, 0.2)', color: '#D4AF37', borderColor: 'rgba(212, 175, 55, 0.4)' }}>
                Visual Showcase
              </span>
              <h1 style={{ color: '#FFFFFF', marginTop: '0.5rem', marginBottom: '1rem' }}>Campus Photo Gallery</h1>
              <p style={{ color: '#CBD5E1', maxWidth: '680px', margin: '0 auto', fontSize: '1.1rem' }}>
                Explore the academic, sports, and infrastructural life of Siang Royal School in East Siang.
              </p>
            </div>
          </div>

          <section className="section">
            <div className="container">
              {/* Filter Tabs */}
              <div className="filter-tabs">
                {['All', 'Campus', 'Academic', 'Sports', 'Activities'].map((cat) => (
                  <button
                    key={cat}
                    onClick={() => { setFilter(cat); setLightboxIdx(null); }}
                    className={`filter-tab ${filter === cat ? 'active' : ''}`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              {/* Gallery Grid */}
              <div className="gallery-grid">
                {filteredGallery.map((item, idx) => (
                  <div
                    key={item.id}
                    className="gallery-card"
                    onClick={() => setLightboxIdx(idx)}
                  >
                    <div className="gallery-image-wrapper">
                      <img src={item.image} alt={item.title} />
                      <div className="gallery-overlay">
                        <span className="gallery-badge">{item.category}</span>
                        <h4 className="gallery-title">{item.title}</h4>
                      </div>
                    </div>
                  </div>
                ))}
              </div>

              {/* Lightbox Modal */}
              {lightboxIdx !== null && filteredGallery[lightboxIdx] && (
                <div className="lightbox-modal" onClick={(e) => { if (e.target.classList.contains('lightbox-modal')) setLightboxIdx(null); }}>
                  <button className="lightbox-close" onClick={() => setLightboxIdx(null)}>&times;</button>
                  <button
                    className="lightbox-nav-btn lightbox-prev"
                    onClick={(e) => { e.stopPropagation(); setLightboxIdx((lightboxIdx - 1 + filteredGallery.length) % filteredGallery.length); }}
                    aria-label="Previous image"
                  >
                    &#10094;
                  </button>

                  <div className="lightbox-content" onClick={(e) => e.stopPropagation()}>
                    <div className="lightbox-img-wrap">
                      <img src={filteredGallery[lightboxIdx].image} alt={filteredGallery[lightboxIdx].title} />
                    </div>
                    <div className="lightbox-details">
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <div>
                          <span className="gallery-badge">{filteredGallery[lightboxIdx].category}</span>
                          <h3 style={{ color: '#0F2C59', margin: '0.25rem 0' }}>{filteredGallery[lightboxIdx].title}</h3>
                          <p style={{ color: '#64748B', fontSize: '0.875rem', margin: 0 }}>{filteredGallery[lightboxIdx].caption}</p>
                        </div>
                        <div style={{ color: '#94A3B8', fontSize: '0.85rem' }}>
                          {lightboxIdx + 1} / {filteredGallery.length}
                        </div>
                      </div>
                    </div>
                  </div>

                  <button
                    className="lightbox-nav-btn lightbox-next"
                    onClick={(e) => { e.stopPropagation(); setLightboxIdx((lightboxIdx + 1) % filteredGallery.length); }}
                    aria-label="Next image"
                  >
                    &#10094;
                  </button>
                </div>
              )}
            </div>
          </section>
        </div>
      );
    }

    // =========================================================================
    // 11. CONTACT US PAGE VIEW
    // =========================================================================
    function ContactPage({ showToast }) {
      const [contactForm, setContactForm] = useState({
        name: '',
        email: '',
        phone: '',
        subject: '',
        message: ''
      });
      const [errors, setErrors] = useState({});
      const [submitted, setSubmitted] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        const errs = {};
        if (!contactForm.name.trim()) errs.name = 'Please provide your full name';
        if (!contactForm.email.trim() || !contactForm.email.includes('@')) errs.email = 'Valid email is required';
        if (!contactForm.phone.trim() || contactForm.phone.length < 10) errs.phone = 'Valid phone number is required';
        if (!contactForm.message.trim()) errs.message = 'Please enter your message';

        if (Object.keys(errs).length > 0) {
          setErrors(errs);
          return;
        }

        setErrors({});
        setSubmitted(true);
        setTimeout(() => {
          setSubmitted(false);
          setContactForm({ name: '', email: '', phone: '', subject: '', message: '' });
          showToast('Message sent! Our office will get back to you soon.');
        }, 2000);
      };

      return (
        <div>
          <div style={{ background: '#0F2C59', color: '#FFFFFF', padding: '4rem 0 3.5rem', textAlign: 'center' }}>
            <div className="container">
              <span className="section-badge" style={{ background: 'rgba(212, 175, 55, 0.2)', color: '#D4AF37', borderColor: 'rgba(212, 175, 55, 0.4)' }}>
                Connect With Us
              </span>
              <h1 style={{ color: '#FFFFFF', marginTop: '0.5rem', marginBottom: '1rem' }}>Contact Siang Royal School</h1>
              <p style={{ color: '#CBD5E1', maxWidth: '680px', margin: '0 auto', fontSize: '1.1rem' }}>
                We welcome parent enquiries, campus visitation requests, and institutional communications.
              </p>
            </div>
          </div>

          <section className="section">
            <div className="container">
              <div style={{ display: 'grid', gridTemplateColumns: '0.9fr 1.1fr', gap: '3.5rem' }}>
                {/* Contact Information Cards */}
                <div>
                  <span className="section-badge">School Office</span>
                  <h2 className="section-title">Institutional Location</h2>
                  <p style={{ color: '#64748B', marginBottom: '2rem' }}>
                    Situated in the picturesque East Siang district of Arunachal Pradesh.
                  </p>

                  <div style={{ display: 'flex', flexDirection: 'column', gap: '1.25rem' }}>
                    <div className="card" style={{ display: 'flex', gap: '1.25rem', alignItems: 'flex-start' }}>
                      <div style={{ width: '48px', height: '48px', borderRadius: '10px', background: '#E0F2FE', color: '#0284C7', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                        <Icon name="mapPin" size={24} color="#0284C7" />
                      </div>
                      <div>
                        <h4 style={{ color: '#0F2C59', marginBottom: '0.25rem' }}>Campus Address</h4>
                        <p style={{ color: '#64748B', fontSize: '0.925rem', margin: 0 }}>{data.general.address.full}</p>
                      </div>
                    </div>

                    <div className="card" style={{ display: 'flex', gap: '1.25rem', alignItems: 'flex-start' }}>
                      <div style={{ width: '48px', height: '48px', borderRadius: '10px', background: '#FEF3C7', color: '#D97706', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                        <Icon name="phone" size={24} color="#D97706" />
                      </div>
                      <div>
                        <h4 style={{ color: '#0F2C59', marginBottom: '0.25rem' }}>Official Phone</h4>
                        <a href={`tel:${data.general.contact.phone}`} style={{ fontSize: '1.1rem', fontWeight: '700', color: '#0F2C59' }}>
                          {data.general.contact.phone}
                        </a>
                        <div style={{ fontSize: '0.8rem', color: '#94A3B8' }}>Verified SARAS Contact Number</div>
                      </div>
                    </div>

                    <div className="card" style={{ display: 'flex', gap: '1.25rem', alignItems: 'flex-start' }}>
                      <div style={{ width: '48px', height: '48px', borderRadius: '10px', background: '#DCFCE7', color: '#16A34A', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                        <Icon name="mail" size={24} color="#16A34A" />
                      </div>
                      <div>
                        <h4 style={{ color: '#0F2C59', marginBottom: '0.25rem' }}>Official Email</h4>
                        <a href={`mailto:${data.general.contact.email}`} style={{ fontSize: '1.05rem', fontWeight: '600', color: '#0F2C59' }}>
                          {data.general.contact.email}
                        </a>
                        <div style={{ fontSize: '0.8rem', color: '#94A3B8' }}>Verified SARAS School Email</div>
                      </div>
                    </div>

                    <div className="card" style={{ display: 'flex', gap: '1.25rem', alignItems: 'flex-start' }}>
                      <div style={{ width: '48px', height: '48px', borderRadius: '10px', background: '#F1F5F9', color: '#64748B', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                        <Icon name="clock" size={24} color="#64748B" />
                      </div>
                      <div>
                        <h4 style={{ color: '#0F2C59', marginBottom: '0.25rem' }}>Administrative Hours</h4>
                        <p style={{ color: '#64748B', fontSize: '0.925rem', margin: 0 }}>{data.general.contact.officeHours}</p>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Interactive Contact Form */}
                <div>
                  <div className="card" style={{ padding: '2.5rem' }}>
                    <h3 style={{ color: '#0F2C59', marginBottom: '0.5rem' }}>Send Us a Message</h3>
                    <p style={{ color: '#64748B', fontSize: '0.9rem', marginBottom: '1.5rem' }}>
                      Please submit your message and our office will respond at the earliest.
                    </p>

                    {submitted ? (
                      <div style={{ textAlign: 'center', padding: '3rem 1rem' }}>
                        <div style={{ width: '60px', height: '60px', borderRadius: '50%', background: '#DCFCE7', color: '#166534', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 1rem' }}>
                          <Icon name="checkCircle" size={32} color="#166534" />
                        </div>
                        <h4 style={{ color: '#0F2C59', marginBottom: '0.5rem' }}>Message Dispatched!</h4>
                        <p style={{ color: '#64748B', fontSize: '0.9rem' }}>
                          Thank you for reaching out to Siang Royal School.
                        </p>
                      </div>
                    ) : (
                      <form onSubmit={handleSubmit}>
                        <div className="form-group">
                          <label className="form-label">Your Full Name *</label>
                          <input
                            type="text"
                            className={`form-control ${errors.name ? 'error' : ''}`}
                            placeholder="Enter your name"
                            value={contactForm.name}
                            onChange={(e) => setContactForm({ ...contactForm, name: e.target.value })}
                          />
                          {errors.name && <span className="form-error-msg">{errors.name}</span>}
                        </div>

                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                          <div className="form-group">
                            <label className="form-label">Email Address *</label>
                            <input
                              type="email"
                              className={`form-control ${errors.email ? 'error' : ''}`}
                              placeholder="name@domain.com"
                              value={contactForm.email}
                              onChange={(e) => setContactForm({ ...contactForm, email: e.target.value })}
                            />
                            {errors.email && <span className="form-error-msg">{errors.email}</span>}
                          </div>
                          <div className="form-group">
                            <label className="form-label">Phone Number *</label>
                            <input
                              type="tel"
                              className={`form-control ${errors.phone ? 'error' : ''}`}
                              placeholder="10-digit mobile"
                              value={contactForm.phone}
                              onChange={(e) => setContactForm({ ...contactForm, phone: e.target.value })}
                            />
                            {errors.phone && <span className="form-error-msg">{errors.phone}</span>}
                          </div>
                        </div>

                        <div className="form-group">
                          <label className="form-label">Subject</label>
                          <input
                            type="text"
                            className="form-control"
                            placeholder="General Enquiry / Admissions / Verification"
                            value={contactForm.subject}
                            onChange={(e) => setContactForm({ ...contactForm, subject: e.target.value })}
                          />
                        </div>

                        <div className="form-group">
                          <label className="form-label">Your Message *</label>
                          <textarea
                            className={`form-control ${errors.message ? 'error' : ''}`}
                            rows="4"
                            placeholder="Write your message here..."
                            value={contactForm.message}
                            onChange={(e) => setContactForm({ ...contactForm, message: e.target.value })}
                          ></textarea>
                          {errors.message && <span className="form-error-msg">{errors.message}</span>}
                        </div>

                        <button type="submit" className="btn btn-primary" style={{ width: '100%', marginTop: '1rem' }}>
                          Send Message
                        </button>
                        <p style={{ fontSize: '0.75rem', color: '#94A3B8', marginTop: '0.75rem', textAlign: 'center' }}>
                          Direct contact also available at <strong>siangroyalschool@gmail.com</strong> or <strong>7002857014</strong>.
                        </p>
                      </form>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
